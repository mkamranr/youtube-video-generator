<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VideoGen — Archive</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="nav"></div>
<main>
  <div class="page-head">
    <div>
      <h1 class="page-title">Archived jobs</h1>
      <p class="page-sub" style="margin:0">Files stay in <code>output/&lt;job_id&gt;/</code>; unarchive to bring a job back, or delete to remove it for good.</p>
    </div>
    <div class="spacer"></div>
    <select id="ownerFilter" hidden style="max-width:180px"><option value="">All owners</option></select>
    <select id="channelFilter" style="max-width:200px"><option value="">All channels</option></select>
    <div class="search-box" id="jobSearchBox"><input type="text" id="jobSearch" placeholder="Search archived jobs..."></div>
  </div>
  <div id="jobs"><div class="empty">No archived jobs.</div></div>
  <div class="row" id="pager" style="justify-content:center;align-items:center;gap:6px;margin:12px 0 8px" hidden></div>
</main>
<script src="/js/common.js"></script>
<script>
document.getElementById("nav").outerHTML = navbar("archive");

async function unarchiveJob(ev, id) {
  ev.preventDefault(); ev.stopPropagation();
  try { await api(`/jobs/${id}/unarchive`, { method: "POST" }); toast("Job restored to the main list"); await refresh(); }
  catch (e) { toast(e.message, true); }
}

async function removeJob(ev, id) {
  ev.preventDefault(); ev.stopPropagation();
  if (!confirm("Delete this job and all its files permanently?")) return;
  try {
    const r = await api(`/jobs/${id}`, { method: "DELETE" });
    toast(r.warning ? `Job deleted - ${r.warning}` : `Job deleted - ${r.freed_mb} MB freed`, !!r.warning);
    await refresh();
  }
  catch (e) { toast(e.message, true); }
}

function thumbHTML(j) {
  return (j.files || []).includes("thumbnail.jpg")
    ? `<img class="jc-thumb" src="/jobs/${j.id}/files/thumbnail.jpg?v=${j.updated}" alt="" loading="lazy">`
    : `<div class="jc-thumb ph">${icon("video")}</div>`;
}

function jobCard(j) {
  return `<a class="jobcard" href="/job/${j.id}">
    ${thumbHTML(j)}
    <div class="jc-main">
      <div class="jc-title">${esc(j.title || j.url)}</div>
      <div class="jc-url">${esc(j.url)}</div>
      <div class="jc-meta">
        <span class="jid">${j.id}</span>
        ${j.channel && j.channel.name ? `<span>${esc(j.channel.name)}</span>` : ""}
        ${j.owner_name ? `<span>${ownerBadge(j.owner_name)}</span>` : ""}
        <span>${esc(j.aspect_ratio || "")}</span>
        ${j.megapixels ? `<span>${j.megapixels} MP</span>` : ""}
        ${resolutionBadge(j)}
        ${j.clips_total ? `<span>${j.clips_done}/${j.clips_total} clips</span>` : ""}
        ${clipTimingText(j)}
        <span>${timeAgo(j.created)}</span>
      </div>
    </div>
    <div class="jc-side">
      <div style="display:flex;gap:8px;align-items:center">
        ${j.status === "done" && j.final ? `<button class="btn sm" onclick="bundleDownload(event,'${j.id}')" title="Download the video, thumbnail, audio and SEO text as one ZIP">Bundle</button>` : ""}
        <button class="btn secondary sm" onclick="unarchiveJob(event,'${j.id}')">Unarchive</button>
        <button class="btn danger sm" onclick="removeJob(event,'${j.id}')">Delete</button>
        ${pillHTML(j)}
      </div>
      <div class="jc-detail ${j.error ? "error" : ""}">${esc(j.error || "")}</div>
    </div>
  </a>`;
}

let lastJobs = [];
let admin = false;   // admins see every user's archived jobs, tagged with the owner

function applyFilter(jobs) {
  const cf = $("#channelFilter").value, of = $("#ownerFilter").value;
  const q = ($("#jobSearch").value || "").trim().toLowerCase();
  let out = jobs;
  if (cf) out = out.filter(j => j.channel_id === cf);
  if (of) out = out.filter(j => j.owner === of);
  if (q) out = out.filter(j =>
    [j.title, j.url, j.topic, j.id, j.status, j.art_style,
     j.channel && j.channel.name, j.owner_name].join(" ").toLowerCase().includes(q));
  return out;
}

async function loadChannelFilter() {
  try {
    const o = await api("/options");
    admin = isAdmin(o.me || currentUser);
    const label = c => admin && c.owner_name ? `${c.name} — ${c.owner_name}` : c.name;
    $("#channelFilter").innerHTML = `<option value="">All channels</option>` +
      (o.channels || []).map(c => `<option value="${esc(c.id)}">${esc(label(c))}</option>`).join("");
    rebuildOwnerFilter();
  } catch (e) { /* filter stays on All channels */ }
}

function rebuildOwnerFilter() {
  const sel = $("#ownerFilter");
  if (!admin) { sel.hidden = true; return; }
  const owners = new Map();
  lastJobs.forEach(j => { if (j.owner) owners.set(j.owner, j.owner_name || j.owner); });
  const cur = sel.value;
  sel.innerHTML = `<option value="">All owners</option>` + [...owners].sort((a, b) => a[1].localeCompare(b[1]))
    .map(([id, name]) => `<option value="${esc(id)}">${esc(name)}</option>`).join("");
  if ([...sel.options].some(o => o.value === cur)) sel.value = cur;
  sel.hidden = false;
}

const PAGE_SIZE = 10;
let page = 1;

function goPage(n) { page = n; render(applyFilter(lastJobs)); }

function renderPager(total) {
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  const p = $("#pager");
  p.hidden = pages <= 1;
  if (pages <= 1) { p.innerHTML = ""; return; }
  const btn = (label, target, dis, cur) =>
    `<button class="btn ${cur ? "" : "secondary "}sm" ${dis ? "disabled" : ""} onclick="goPage(${target})">${label}</button>`;
  const nums = [];
  for (let i = 1; i <= pages; i++) {
    if (i === 1 || i === pages || Math.abs(i - page) <= 2) nums.push(i);
    else if (nums[nums.length - 1] !== "…") nums.push("…");
  }
  p.innerHTML = btn("‹", page - 1, page === 1, false)
    + nums.map(n => n === "…" ? `<span class="hint">…</span>` : btn(n, n, false, n === page)).join("")
    + btn("›", page + 1, page === pages, false)
    + `<span class="hint" style="margin-left:8px">${total} job${total === 1 ? "" : "s"}</span>`;
}

function render(jobs) {
  const pages = Math.max(1, Math.ceil(jobs.length / PAGE_SIZE));
  if (page > pages) page = pages;
  if (jobs.length) {
    $("#jobs").innerHTML = jobs.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE).map(jobCard).join("");
  } else {
    $("#jobs").innerHTML = lastJobs.length
      ? `<div class="empty">${icon("search")}No archived jobs match your search.</div>`
      : `<div class="empty">${icon("archive")}No archived jobs.</div>`;
  }
  renderPager(jobs.length);
}

async function refresh() {
  try {
    lastJobs = await api("/jobs?archived=true");
    rebuildOwnerFilter();
    render(applyFilter(lastJobs));
  } catch (e) { console.error(e); }
}

$("#jobSearchBox").insertAdjacentHTML("afterbegin", icon("search"));
$("#jobSearch").addEventListener("input", () => { page = 1; render(applyFilter(lastJobs)); });
$("#channelFilter").addEventListener("change", () => { page = 1; render(applyFilter(lastJobs)); });
$("#ownerFilter").addEventListener("change", () => { page = 1; render(applyFilter(lastJobs)); });
loadChannelFilter();
refresh();
</script>
</body>
</html>
