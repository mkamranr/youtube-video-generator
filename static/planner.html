<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VideoGen — Planner</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<style>
  .day-row { display: grid; grid-template-columns: 132px 1fr auto; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); align-items: start; }
  .day-row:first-child { border-top: 0; }
  .day-when { color: var(--muted); font-size: 13px; line-height: 1.5; }
  .day-when b { display: block; color: var(--fg); font-size: 14px; }
  .day-title { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
  .day-text { color: var(--fg); font-size: 14px; line-height: 1.55; }
  .day-extra { color: var(--muted); font-size: 13px; line-height: 1.55; margin-top: 6px; }
  .day-side { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; min-width: 128px; }
  .day-row.busy { opacity: .55; }
  .day-row textarea, .day-row input[type="text"] { width: 100%; }
  @media (max-width: 760px) { .day-row { grid-template-columns: 1fr; } .day-side { align-items: flex-start; } }
</style>
</head>
<body>
<div id="nav"></div>
<main>
  <div class="page-head">
    <div>
      <h1 class="page-title">Planner</h1>
      <p class="page-sub" style="margin:0">A week of videos for one channel, written by the LLM. Review the ideas, rewrite the ones you don't like, then turn the good ones into videos.</p>
    </div>
  </div>

  <section class="card">
    <h2>New weekly plan</h2>
    <div class="row" style="margin-top:6px">
      <div class="grow" style="min-width:220px">
        <label for="channel">Channel</label>
        <select id="channel"></select>
      </div>
      <div class="grow" style="min-width:170px">
        <label for="weekStart">Week starts</label>
        <input type="date" id="weekStart">
      </div>
      <div class="grow" style="min-width:150px">
        <label for="planVideos">Videos this week</label>
        <select id="planVideos"></select>
      </div>
      <div class="grow" id="planModeField" style="min-width:180px" hidden>
        <label for="planMode">Video type</label>
        <select id="planMode"></select>
      </div>
      <div class="grow" style="min-width:260px">
        <label for="notes">Anything specific this week? (optional)</label>
        <input type="text" id="notes" placeholder="e.g. stories about sharing and first days at school">
      </div>
    </div>
    <div class="hint" id="planVideosHint" style="margin-top:8px"></div>
    <div class="hint" id="planModeHint" hidden style="margin-top:8px"></div>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="genBtn">Generate plan</button>
      <span class="hint" id="genHint"></span>
    </div>
  </section>

  <div id="plans"></div>
</main>
<script src="/js/common.js"></script>
<script>
document.getElementById("nav").outerHTML = navbar("planner");

let channelsList = [];   // the channels the user may plan for
let plans = [];          // plans of the selected channel, newest first
let busy = new Set();    // "planId:day" rows with a request in flight
// how many videos a week may hold; replaced by the server's own numbers on the first refresh
let planLimits = { min_videos: 2, max_videos: 7, default_videos: 7, days: 7 };
let finishedJobs = [];   // ids of this channel's finished videos - which weeks can be compiled

function channelName(cid) {
  const c = channelsList.find(x => x.id === cid);
  return c ? c.name : "(deleted channel)";
}

function channelOf(cid) { return channelsList.find(x => x.id === cid); }

// the same gate the New Video dialog uses (static/index.html applyVideoMode); the planner has no
// source picker, and its source is always "description", which is already a story source
function storyChannel(ch) {
  return !!ch && ch.audience === "kids" && ch.characters_enabled !== false
      && (ch.cast || []).length > 0;
}

let videoModes = ["song"], videoModeLabels = {};

function modeOptions(selected) {
  return videoModes.map(m =>
    `<option value="${esc(m)}" ${m === selected ? "selected" : ""}>${esc(videoModeLabels[m] || m)}</option>`).join("");
}

// The plan the rows will be confirmed into. A plan stores its own format, so an eligible plan keeps
// a live select in its header; everything else is a song week and sends nothing.
function modeOf(planId) {
  const sel = document.querySelector(`.plan-mode[data-plan="${planId}"]`);
  return sel ? sel.value : "";
}

function applyPlanMode() {
  const ch = channelOf($("#channel").value);
  const show = storyChannel(ch);
  // hiding it resets it, so an invisible choice is never posted
  if (!show && !$("#planModeField").hidden) $("#planMode").value = "song";
  $("#planModeField").hidden = !show;
  const story = show && $("#planMode").value === "story";
  $("#planModeHint").hidden = !story;
  $("#planModeHint").textContent = "Every video of this week becomes a story: the LLM writes the "
    + "scenes and the voiceover is only what happens and what the characters say. You still review "
    + "each one before it renders.";
}

function dayLabel(row) {
  if (!row.date) return `Day ${row.day}`;
  const d = new Date(row.date + "T00:00:00");
  return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}

function rowHTML(plan, row) {
  const key = `${plan.id}:${row.day}`;
  const done = !!row.job_id;
  const actors = (row.actors || []).map(a => `<span class="chip">${esc(a)}</span>`).join(" ");
  return `<div class="day-row ${busy.has(key) ? "busy" : ""}">
    <div class="day-when"><b>Day ${row.day}</b>${esc(dayLabel(row))}</div>
    <div>
      <div class="day-title">${esc(row.title || "(empty - regenerate this day)")}</div>
      ${actors ? `<div class="chips" style="margin:4px 0 6px">${actors}</div>` : ""}
      <div class="day-text">${esc(row.description)}</div>
      ${row.hook ? `<div class="day-extra"><b>Hook:</b> ${esc(row.hook)}</div>` : ""}
      ${row.thumbnail_idea ? `<div class="day-extra"><b>Thumbnail:</b> ${esc(row.thumbnail_idea)}</div>` : ""}
    </div>
    <div class="day-side">
      ${done
        ? `<a class="btn secondary sm" href="/job/${esc(row.job_id)}">Open video</a>
           <span class="pill planned">made</span>`
        : `<label class="hint" style="display:flex;gap:6px;align-items:center">
             <input type="checkbox" class="rowpick" data-plan="${plan.id}" data-day="${row.day}"> select
           </label>
           <button class="btn sm" onclick="makeJobs('${plan.id}',[${row.day}])">Make video</button>
           <button class="btn secondary sm" onclick="regenerate('${plan.id}',[${row.day}])">Rewrite</button>`}
    </div>
  </div>`;
}

// The payoff of a planned week: once its videos are finished they are also the material for one
// long video. The button hands the jobs to the compilation picker on the Jobs page rather than
// creating anything here - which videos go in, and in what order, is a judgement call.
function compileRowHTML(plan) {
  const ids = (plan.days || []).map(d => d.job_id).filter(Boolean);
  const ready = (finishedJobs.length ? ids.filter(id => finishedJobs.includes(id)) : []);
  if (ready.length < 2) return "";
  return `<div class="row" style="margin-top:4px;align-items:center;gap:10px">
    <button class="btn secondary sm" onclick="compileWeek('${plan.id}')">Make a compilation from this week</button>
    <span class="hint" style="margin:0">${ready.length} of this week's videos are finished. One long
      video of them holds a viewer for minutes instead of seconds, which is the watch time that gets
      a channel recommended.</span>
  </div>`;
}

function compileWeek(planId) {
  const plan = plans.find(p => p.id === planId);
  const ids = (plan.days || []).map(d => d.job_id).filter(id => id && finishedJobs.includes(id));
  // the picker on the Jobs page reads this and pre-ticks exactly these videos, in week order
  sessionStorage.setItem("videogen.compile", JSON.stringify({ channel_id: plan.channel_id, parts: ids }));
  location.href = "/#compile";
}

function planHTML(plan) {
  const made = (plan.days || []).filter(d => d.job_id).length;
  return `<section class="card">
    <h2>Week of ${esc(plan.week_start)} <span class="count">${esc(channelName(plan.channel_id))}</span></h2>
    <div class="hint" style="margin-bottom:10px">
      ${made}/${(plan.days || []).length} made${plan.notes ? ` &middot; ${esc(plan.notes)}` : ""}
      ${plan.owner_name ? ` &middot; ${esc(plan.owner_name)}` : ""}
    </div>
    ${storyChannel(channelOf(plan.channel_id)) ? `<div class="row" style="margin-bottom:10px;align-items:center;gap:8px">
      <label for="planMode-${esc(plan.id)}" style="margin:0">Video type</label>
      <select class="plan-mode" id="planMode-${esc(plan.id)}" data-plan="${esc(plan.id)}"
              style="max-width:180px">${modeOptions(plan.video_mode || "song")}</select>
      <span class="hint">applied to every video you make from this week</span>
    </div>` : ""}
    ${(plan.days || []).map(d => rowHTML(plan, d)).join("")}
    <div class="row" style="margin-top:14px">
      <button class="btn" onclick="makeSelected('${plan.id}')">Make selected videos</button>
      <button class="btn secondary" onclick="regenSelected('${plan.id}')">Rewrite selected</button>
      <div class="spacer"></div>
      <button class="btn danger sm" onclick="removePlan('${plan.id}')">Delete plan</button>
    </div>
    ${compileRowHTML(plan)}
  </section>`;
}

function render() {
  $("#plans").innerHTML = plans.length
    ? plans.map(planHTML).join("")
    : `<div class="empty">${icon("calendar")}No plan yet for this channel - generate one above.</div>`;
}

function picked(planId) {
  return [...document.querySelectorAll(`.rowpick[data-plan="${planId}"]`)]
    .filter(cb => cb.checked).map(cb => Number(cb.dataset.day));
}

async function refresh() {
  try {
    const d = await api(`/api/plans?channel_id=${encodeURIComponent($("#channel").value)}`);
    plans = d.plans || [];
    planLimits = { min_videos: d.min_videos, max_videos: d.max_videos,
                   default_videos: d.default_videos, days: d.days };
    if (!$("#planVideos").options.length) {
      const opts = [];
      for (let n = planLimits.min_videos; n <= planLimits.max_videos; n++) {
        opts.push(`<option value="${n}" ${n === planLimits.default_videos ? "selected" : ""}>${n} video${n > 1 ? "s" : ""}</option>`);
      }
      $("#planVideos").innerHTML = opts.join("");
      applyPlanVideos();
    }
    try {
      const c = await api(`/api/compilations/candidates?channel_id=${encodeURIComponent($("#channel").value)}`);
      finishedJobs = (c.videos || []).map(v => v.id);
    } catch (e) { finishedJobs = []; }   // only costs the compilation button
    render();
  } catch (e) { toast(e.message, true); }
}

async function regenerate(planId, days, feedback = "") {
  if (!days.length) { toast("Select at least one day first", true); return; }
  days.forEach(d => busy.add(`${planId}:${d}`));
  render();
  try {
    const plan = await api(`/api/plans/${planId}/regenerate`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ days, feedback }) });
    plans = plans.map(p => (p.id === plan.id ? plan : p));
    toast(days.length > 1 ? `${days.length} days rewritten` : `Day ${days[0]} rewritten`);
  } catch (e) { toast(e.message, true); }
  finally { days.forEach(d => busy.delete(`${planId}:${d}`)); render(); }
}

function regenSelected(planId) { regenerate(planId, picked(planId)); }

async function makeJobs(planId, days) {
  if (!days.length) { toast("Select at least one day first", true); return; }
  days.forEach(d => busy.add(`${planId}:${d}`));
  render();
  try {
    const r = await api(`/api/plans/${planId}/jobs`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ days, video_mode: modeOf(planId) }) });
    plans = plans.map(p => (p.id === r.plan.id ? r.plan : p));
    const n = (r.jobs || []).length;
    toast(n ? `${n} video${n > 1 ? "s" : ""} created - open each one to set it up` : "Nothing to create");
  } catch (e) { toast(e.message, true); }
  finally { days.forEach(d => busy.delete(`${planId}:${d}`)); render(); }
}

function makeSelected(planId) { makeJobs(planId, picked(planId)); }

async function removePlan(planId) {
  if (!confirm("Delete this plan? Videos already created from it stay.")) return;
  try {
    await api(`/api/plans/${planId}`, { method: "DELETE" });
    plans = plans.filter(p => p.id !== planId);
    render();
    toast("Plan deleted");
  } catch (e) { toast(e.message, true); }
}

$("#genBtn").onclick = async () => {
  if (!$("#channel").value) { toast("Create a channel first (Settings > Channels)", true); return; }
  $("#genBtn").disabled = true;
  $("#genHint").textContent = "Writing the week with the LLM - this takes a moment...";
  try {
    const plan = await api("/api/plans", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ channel_id: $("#channel").value, week_start: $("#weekStart").value,
                             notes: $("#notes").value, videos: Number($("#planVideos").value),
                             video_mode: $("#planModeField").hidden ? "" : $("#planMode").value }) });
    plans = [plan, ...plans];
    render();
    toast(`Weekly plan ready - review the ${(plan.days || []).length} ideas`);
  } catch (e) { toast(e.message, true); }
  finally { $("#genBtn").disabled = false; $("#genHint").textContent = ""; }
};

$("#channel").addEventListener("change", () => { applyPlanMode(); refresh(); });
$("#planMode").addEventListener("change", applyPlanMode);
$("#planVideos").addEventListener("change", applyPlanVideos);

// Why a channel would plan fewer than seven: a new channel's reach is split across everything it
// uploads, so a daily trickle of thin videos competes with itself. The hint says so where the
// choice is made rather than leaving the number looking like a limitation.
function applyPlanVideos() {
  const n = Number($("#planVideos").value) || planLimits.days;
  $("#planVideosHint").textContent = n >= planLimits.days
    ? "One video a day. Every upload competes with the others for the same audience, so consider fewer, stronger videos plus a compilation of the finished ones."
    : `${n} videos, spaced out over the week, and each one written to be worth a full watch rather than one day of seven. The days in between are where a compilation of already-finished videos goes - one long video holds a viewer far longer than several short ones.`;
}

(async function init() {
  const monday = new Date();
  monday.setDate(monday.getDate() + ((8 - monday.getDay()) % 7 || 7));   // the next Monday
  $("#weekStart").value = monday.toISOString().slice(0, 10);
  try {
    const o = await api("/options");
    channelsList = o.channels || [];
    videoModes = o.video_modes || ["song"];
    videoModeLabels = o.video_mode_labels || {};
    $("#planMode").innerHTML = modeOptions(o.default_video_mode || "song");
    $("#channel").innerHTML = channelsList.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("")
      || `<option value="">No channel yet</option>`;
    if (o.default_channel_id) $("#channel").value = o.default_channel_id;
  } catch (e) { toast(e.message, true); }
  applyPlanMode();
  applyPlanVideos();
  await refresh();
})();
</script>
</body>
</html>
