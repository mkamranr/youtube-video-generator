<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VideoGen — Jobs</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="nav"></div>
<main>
  <div class="page-head">
    <div>
      <h1 class="page-title">Jobs</h1>
      <p class="page-sub" style="margin:0">Videos for your YouTube channel — generated, reviewed, published.</p>
    </div>
    <div class="spacer"></div>
    <div class="search-box" id="jobSearchBox"><input type="text" id="jobSearch" placeholder="Search jobs..."></div>
    <button class="btn" id="openCreate"></button>
  </div>

  <div class="modal-backdrop" id="createModal">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modalTitle">New Video</h3>
        <div class="spacer"></div>
        <button class="icon-btn" id="closeCreate" title="Close"></button>
      </div>
      <div class="modal-body">
        <p class="page-sub" id="subText" style="margin-bottom:16px">Paste YouTube URLs (one per line). Each becomes a job: transcript → LLM script → soundtrack → AI clips synced to the audio → final video.</p>
        <div class="row" style="margin-bottom:14px">
          <div class="grow" style="min-width:200px">
            <label for="source">Create from</label>
            <select id="source">
              <option value="url" selected>YouTube URLs</option>
              <option value="topic">Topic</option>
              <option value="description">Description / short script</option>
            </select>
          </div>
          <div class="grow" style="min-width:160px">
            <label for="vlen">Video length</label>
            <select id="vlen"></select>
          </div>
          <div class="grow" style="min-width:180px">
            <label for="ar">Aspect ratio</label>
            <select id="ar"></select>
          </div>
          <div class="grow" style="min-width:170px">
            <label for="audio">Audio</label>
            <select id="audio">
              <option value="music">Generate Song</option>
              <option value="narration+music">Generate Voiceover</option>
            </select>
          </div>
          <div class="grow" id="voiceField" style="min-width:170px" hidden>
            <label for="voice">Voice</label>
            <select id="voice"><option value="">Default voice</option></select>
          </div>
        </div>
        <label for="urls" id="inputLabel">YouTube URLs</label>
        <textarea id="urls" placeholder="https://www.youtube.com/watch?v=..."></textarea>
        <div style="margin-top:14px;max-width:420px">
          <label for="artstyle">Art style</label>
          <div class="combo">
            <input type="text" id="artstyle" autocomplete="off" spellcheck="false" placeholder="Search art styles...">
            <div class="combo-list" id="artstyleList" hidden></div>
          </div>
          <img id="stylePreview" alt="style preview" hidden
               style="width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;margin-top:10px">
        </div>
        <div class="row" style="margin-top:18px">
          <button class="btn" id="go"></button>
          <button class="btn secondary" id="cancelCreate" type="button">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card" style="padding:20px 20px 8px">
    <h2>Jobs <span class="count" id="count"></span></h2>
    <div id="jobs"></div>
  </div>
</main>
<script src="/js/common.js"></script>
<script>
document.getElementById("nav").outerHTML = navbar("home");

const SOURCE_UI = {
  url: { label: "YouTube URLs", ph: "https://www.youtube.com/watch?v=... (one per line)",
         sub: "Paste YouTube URLs (one per line). Each becomes a job: transcript → LLM script → soundtrack → AI clips synced to the audio → final video." },
  topic: { label: "Topic", ph: "e.g. How bees make honey",
           sub: "Enter one topic. The LLM writes the script immediately (without using the video queue); you review and approve it, then video generation starts." },
  description: { label: "Description / short script", ph: "Describe the video, or paste your own short script...",
                 sub: "Write a description or short script for one video. The LLM builds the full script from it; you review and approve it, then video generation starts." },
};

function applyAudio() { $("#voiceField").hidden = $("#audio").value === "music"; }

async function loadVoices() {
  try {
    const d = await api("/api/voices");
    const cur = $("#voice").value;
    $("#voice").innerHTML = `<option value="">Default voice</option>` +
      d.voices.map(v => `<option value="${esc(v.id)}">${esc(v.name)}</option>`).join("");
    $("#voice").value = cur && d.voices.some(v => v.id === cur) ? cur : "";
  } catch (e) { /* voice list is optional */ }
}

function applySource() {
  const ui = SOURCE_UI[$("#source").value];
  $("#inputLabel").textContent = ui.label;
  $("#urls").placeholder = ui.ph;
  $("#subText").textContent = ui.sub;
}

async function submit() {
  const mode = $("#source").value;
  const raw = $("#urls").value.trim();
  if (!raw) { toast("Enter something first", true); return; }
  if (artStyles.length && !artStyles.includes($("#artstyle").value)) {
    toast("Pick an art style from the list", true); return;
  }
  let body = { aspect_ratio: $("#ar").value, art_style: $("#artstyle").value,
               video_length: $("#vlen").value, audio_mode: $("#audio").value,
               voice_id: $("#audio").value === "music" ? "" : $("#voice").value };
  if (mode === "url") body.urls = raw.split("\n").map(s => s.trim()).filter(Boolean);
  else if (mode === "topic") body.topic = raw;
  else body.description = raw;
  $("#go").disabled = true;
  try {
    const jobs = await api("/jobs", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body) });
    $("#urls").value = "";
    closeCreate();
    toast(mode === "url" ? `${jobs.length} job${jobs.length > 1 ? "s" : ""} queued`
                         : "Job created - the script is being written");
    await refresh();
  } catch (e) { toast(e.message, true); }
  finally { $("#go").disabled = false; }
}

async function cancelJob(ev, id) {
  ev.preventDefault(); ev.stopPropagation();
  if (!confirm("Cancel this running job?")) return;
  try { await api(`/jobs/${id}/cancel`, { method: "POST" }); toast("Cancelling job"); await refresh(); }
  catch (e) { toast(e.message, true); }
}

async function resumeJob(ev, id) {
  ev.preventDefault(); ev.stopPropagation();
  try { await api(`/jobs/${id}/resume`, { method: "POST" }); toast("Job resumed - finished steps will be reused"); await refresh(); }
  catch (e) { toast(e.message, true); }
}

async function archiveJob(ev, id) {
  ev.preventDefault(); ev.stopPropagation();
  try { await api(`/jobs/${id}/archive`, { method: "POST" }); toast("Job archived"); await refresh(); }
  catch (e) { toast(e.message, true); }
}

async function removeJob(ev, id) {
  ev.preventDefault(); ev.stopPropagation();
  if (!confirm("Delete this job and all its files?")) return;
  try { await api(`/jobs/${id}`, { method: "DELETE" }); toast("Job deleted"); await refresh(); }
  catch (e) { toast(e.message, true); }
}

function jobCard(j) {
  const canDelete = ["done", "failed"].includes(j.status);
  const detail = j.error || j.detail || "";
  return `<a class="jobcard" href="/job/${j.id}">
    <div class="jc-main">
      <div class="jc-title">${esc(j.title || j.url || j.topic)}</div>
      <div class="jc-url">${esc(j.url || (j.topic ? (j.source === "description" ? "description: " : "topic: ") + j.topic.slice(0, 90) : ""))}</div>
      <div class="jc-meta">
        <span class="jid">${j.id}</span>
        ${j.art_style ? `<span>${esc(j.art_style)}</span>` : ""}
        ${j.video_length && j.video_length !== "Auto" ? `<span>${esc(j.video_length)}</span>` : ""}
        <span>${esc(j.aspect_ratio || "")}</span>
        ${j.clips_total ? `<span>${j.clips_done}/${j.clips_total} clips</span>` : ""}
        ${(() => { const n = new Set([...(j.stale_clips||[]), ...(j.regen_queue||[])]).size;
           return n ? `<span style="color:var(--warn);font-weight:600">${n} clip${n>1?"s":""} need${n>1?"":"s"} regeneration</span>` : ""; })()}
        <span>${timeAgo(j.created)}</span>
      </div>
    </div>
    <div class="jc-side">
      <div style="display:flex;gap:8px;align-items:center">
        ${j.status === "failed" ? `<button class="btn sm" onclick="resumeJob(event,'${j.id}')">Resume</button>` : ""}
        ${canDelete ? `<button class="btn secondary sm" onclick="archiveJob(event,'${j.id}')">Archive</button>
                       <button class="btn danger sm" onclick="removeJob(event,'${j.id}')">Delete</button>`
                    : `<button class="btn danger sm" onclick="cancelJob(event,'${j.id}')">Cancel</button>`}
        ${pillHTML(j)}
      </div>
      <div class="bar"><i style="width:${pct(j)}%"></i></div>
      <div class="jc-detail ${j.error ? "error" : ""}">${esc(detail)}</div>
    </div>
  </a>`;
}

let lastJobs = [];

function applyFilter(jobs) {
  const q = ($("#jobSearch").value || "").trim().toLowerCase();
  if (!q) return jobs;
  return jobs.filter(j =>
    [j.title, j.url, j.topic, j.id, j.status, j.art_style].join(" ").toLowerCase().includes(q));
}

function render(jobs) {
  $("#count").textContent = lastJobs.length ? `(${lastJobs.length})` : "";
  if (jobs.length) { $("#jobs").innerHTML = jobs.map(jobCard).join(""); return; }
  $("#jobs").innerHTML = lastJobs.length
    ? `<div class="empty">${icon("search")}No jobs match your search.</div>`
    : `<div class="empty">${icon("video")}No jobs yet — click <b>Create new video</b> to start.</div>`;
}

async function refresh() {
  try {
    lastJobs = await api("/jobs");
    render(applyFilter(lastJobs));
  } catch (e) { console.error(e); }
}

let stylePreviews = {};
let artStyles = [];

function renderStyleList(filter) {
  const q = (filter || "").toLowerCase();
  const items = artStyles.filter(a => a.toLowerCase().includes(q));
  const cur = $("#artstyle").value;
  $("#artstyleList").innerHTML = items.length
    ? items.map(a => `<div class="combo-item${a === cur ? " sel" : ""}" data-v="${esc(a)}">${esc(a)}</div>`).join("")
    : `<div class="combo-empty">No matching styles</div>`;
  $("#artstyleList").hidden = false;
}

function hideStyleList() { $("#artstyleList").hidden = true; }

function updateStylePreview() {
  const url = stylePreviews[$("#artstyle").value];
  const img = $("#stylePreview");
  if (url) { img.src = url; img.hidden = false; } else { img.hidden = true; }
}

async function loadOptions() {
  const o = await api("/options");
  $("#ar").innerHTML = o.aspect_ratios.map(a => `<option ${a === o.default_aspect_ratio ? "selected" : ""}>${a}</option>`).join("");
  artStyles = o.art_styles;
  $("#artstyle").value = o.default_art_style;
  $("#source").value = o.default_source || "url";
  applySource();
  $("#vlen").innerHTML = o.video_lengths.map(a => `<option ${a === o.default_video_length ? "selected" : ""}>${a}</option>`).join("");
  $("#audio").value = o.default_audio_mode || "music";
  applyAudio();
  loadVoices();
  try { stylePreviews = (await api("/api/style-previews")).previews; } catch (e) { stylePreviews = {}; }
  updateStylePreview();
}

function openCreate() { loadVoices(); $("#createModal").classList.add("open"); setTimeout(() => $("#urls").focus(), 150); }
function closeCreate() { $("#createModal").classList.remove("open"); }
$("#openCreate").innerHTML = icon("plus") + " Create new video";
$("#go").innerHTML = icon("check") + " Generate";
$("#closeCreate").innerHTML = icon("x");
$("#openCreate").onclick = openCreate;
$("#closeCreate").onclick = closeCreate;
$("#cancelCreate").onclick = closeCreate;
$("#createModal").addEventListener("click", ev => { if (ev.target === $("#createModal")) closeCreate(); });
document.addEventListener("keydown", ev => {
  if (ev.key !== "Escape") return;
  if (!$("#artstyleList").hidden) { hideStyleList(); return; }
  closeCreate();
});

$("#go").onclick = submit;
$("#source").onchange = applySource;
$("#audio").onchange = applyAudio;
$("#artstyle").addEventListener("focus", () => renderStyleList(""));
$("#artstyle").addEventListener("input", () => { renderStyleList($("#artstyle").value); updateStylePreview(); });
$("#artstyleList").addEventListener("mousedown", ev => {
  const item = ev.target.closest(".combo-item");
  if (!item) return;
  $("#artstyle").value = item.dataset.v;
  hideStyleList(); updateStylePreview();
});
document.addEventListener("click", ev => { if (!ev.target.closest(".combo")) hideStyleList(); });
$("#jobSearchBox").insertAdjacentHTML("afterbegin", icon("search"));
$("#jobSearch").addEventListener("input", () => render(applyFilter(lastJobs)));
loadOptions();
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
