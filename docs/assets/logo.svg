    <rect x="34" y="88" width="18" height="14" rx="4"/>
    <rect x="34" y="124" width="18" height="14" rx="4"/>
    <rect x="34" y="160" width="18" height="14" rx="4"/>
    <rect x="34" y="196" width="18" height="14" rx="4"/>
